[package]
name = "mirelia-abi"
description = "The only crate exposing extern \"C\": implements audio_core.h as the audio_core_rs cdylib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "audio_core_rs"
crate-type = ["cdylib"]

[dependencies]
mirelia-audio.workspace = true
mirelia-decode.workspace = true

[target.'cfg(windows)'.dependencies]
mirelia-out-wasapi = { path = "../mirelia-out-wasapi" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

[lints]
workspace = true
