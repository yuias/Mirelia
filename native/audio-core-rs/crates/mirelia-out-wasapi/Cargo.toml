[package]
name = "mirelia-out-wasapi"
description = "Mirelia WASAPI output backend, shared mode (exclusive lands in M5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
mirelia-audio.workspace = true
# Needed alongside `windows` because `#[windows::core::implement]`-generated
# code references the `windows_core` crate name directly; it must be a
# direct dependency to be resolvable from the extern prelude.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }

[lints]
workspace = true
