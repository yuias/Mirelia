[package]
name = "mirelia-decode"
description = "Mirelia decoder layer: symphonia glue, sample-accurate seek, gapless trimming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
symphonia = { version = "0.6", default-features = false, features = [
    "mp3",
    "aac",
    "alac",
    "flac",
    "isomp4",
    "pcm",
    "wav",
] }
# EBU R128 loudness (libebur128 port) for ReplayGain 2 scanning.
ebur128 = "0.1"

[lints]
workspace = true
